<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />

      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Dis oui — Générateur d'invitations de rendez-vous interactives</title>
    <!--
      Bloc réécrit par le serveur pour les liens privés (/r/… et /track/…) :
      voir server/socialMeta.ts. Toute balise décrivant le site doit rester
      DANS les marqueurs, sinon elle survit à la réécriture et divulgue la
      nature de l'invitation dans l'aperçu de partage.
    -->
    <!-- social-meta:start -->
    <meta
      name="description"
      content="Créez une invitation de rendez-vous interactive et animée en moins de deux minutes. Gratuit, sans inscription." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dis oui — Invitations de rendez-vous interactives" />
    <meta
      property="og:description"
      content="Créez une invitation de rendez-vous interactive et animée en moins de deux minutes." />
    <meta name="twitter:card" content="summary" />
    <!-- social-meta:end -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f6bf6" />
    <!-- Les polices sont auto-hébergées via @fontsource et importées depuis
         client/src/index.css : aucune requête vers un tiers. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Le script Umami du gabarit était laissé avec ses variables d'environnement
      non substituées : chaque chargement de page déclenchait deux erreurs

      analytics existe réellement. (Ne pas écrire les noms de variables tels
      quels ici : Vite les résout jusque dans les commentaires.)
    -->
